<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Designer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>

    <section class="toolbar">
      <h1>Mapdesigner</h1>

      <h2>Location</h2>
      <location-search></location-search>
      <map-osm id="nav-map"></map-osm>
      <fetch-data-control></fetch-data-control>

      <details>
        <summary>Styles</summary>
        <layer-control-list></layer-control-list>
      </details>
      <details>
        <summary>Size settings</summary>
        <paper-size-control></paper-size-control>
      </details>
      <details>
        <summary>Export</summary>
        <poster-text-control></poster-text-control>
        <map-artwork-detail></map-artwork-detail>
        <export-pdf></export-pdf>
      </details>
      <footer>
        <status-notify></status-notify>
        <p class="attribution">
          By <a href="https://github.com/iamfrank">Iamfrank</a>
          with support from
          <a href="https://www.openstreetmap.org/copyright" target="_blank">
            OpenStreetMap contributors
          </a>
        </p>
      </footer>
    </section>

    <map-artwork></map-artwork>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
